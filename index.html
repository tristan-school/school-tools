<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <h1>School Tools</h1>
        
        <!-- Row 1: Core Portals -->
        <div class="button-row">
            <button class="tool-btn" data-url="https://classroom.google.com" title="Google Classroom">
                Classroom
            </button>
            <button class="tool-btn" data-url="https://drive.google.com" title="Google Drive">
                Drive
            </button>
            <button class="tool-btn" data-url="https://myblueprint.ca" title="MyBlueprint Dashboard">
                MyBlueprint
            </button>
            <button class="tool-btn" data-url="https://gemini.google.com/" title="Gemini Homepage">
                Gemini
            </button>
        </div>
        <!-- Row 2: Google Suite (Cleaned Base URLs) -->
        <div class="button-row">
            <button class="tool-btn" data-url="https://docs.google.com/document" title="Google Docs Homepage">
                Docs
            </button>
            <button class="tool-btn" data-url="https://docs.google.com/presentation" title="Google Slides Homepage">
                Slides
            </button>
            <button class="tool-btn" data-url="https://docs.google.com/spreadsheets" title="Google Sheets Homepage">
                Sheets
            </button>
            <button class="tool-btn" data-url="https://docs.google.com/forms" title="Google Forms Homepage">
                Forms
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
