<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <h1>School Tools</h1>
        
        <!-- Row 1: Misc Core Links -->
        <div class="button-row">
            <button class="tool-btn" data-url="https://classroom.google.com" title="Google Classroom">
                Classroom
            </button>
            <button class="tool-btn" data-url="https://drive.google.com" title="Google Drive">
                Drive
            </button>
            <button class="tool-btn" data-url="https://myblueprint.ca" title="MyBlueprint Dashboard">
                MyBlueprint
            </button>
            <button class="tool-btn" data-url="https://gemini.google.com/" title="Gemini Homepage">
                Gemini
            </button>
        </div>
        <!-- Row 2: Google Suite Homepage Links-->
        <div class="button-row">
            <button class="tool-btn" data-url="https://docs.google.com/document" title="Google Docs Homepage">
                Docs
            </button>
            <button class="tool-btn" data-url="https://docs.google.com/presentation" title="Google Slides Homepage">
                Slides
            </button>
            <button class="tool-btn" data-url="https://docs.google.com/spreadsheets" title="Google Sheets Homepage">
                Sheets
            </button>
            <button class="tool-btn" data-url="https://docs.google.com/forms" title="Google Forms Homepage">
                Forms
            </button>
        </div>
        <!-- Row 3: Google Suite New Creation Links-->
        <div class="button-row">
            <button class="tool-btn" data-url="https://docs.google.com/document/create" title="New Google Docs">
                Docs
            </button>
            <button class="tool-btn" data-url="https://docs.google.com/presentation/create" title="New Google Slides">
                Slides
            </button>
            <button class="tool-btn" data-url="https://docs.google.com/spreadsheets/create" title="New Google Sheets">
                Sheets
            </button>
            <button class="tool-btn" data-url="https://docs.google.com/forms/create" title="New Google Forms">
                Forms
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
